[install]
# Bun isolated linker: each workspace gets its own node_modules view; no hoisted phantom deps.
linker = "isolated"
# Save exact versions; the lock owner (T02) freezes a real bun.lock.
exact = true
# Refuse to auto-trust install scripts; root package.json keeps trustedDependencies empty.
# 7-day minimum release age: newly published versions are not auto-selected.
minimumReleaseAge = 604800
# Documented exemptions for the exact T02-frozen pins that were published less
# than 7 days before the freeze (verified 2026-09-12 against registry.npmjs.org
# `time` fields): vite@8.3.0 (2026-09-10), wrangler@4.131.0 (2026-09-10),
# oxlint@1.82.0 (2026-09-07), oxfmt@0.67.0 (2026-09-07). workerd and miniflare
# are exempted only because the recorded wrangler@4.131.0 pin resolves to their
# same-day releases (workerd@1.20260910.1, miniflare@5.20260910.0-alpha); they
# are not direct dependencies. The matching oxlint/oxfmt native bindings were
# published with those wrappers and need their own exemptions: Bun applies the
# age filter to transitive optional dependencies independently.
# Exemptions match package names, not versions; package.json and bun.lock retain
# the exact pins. Revisit these names when changing pins or once they age out.
# All other packages retain the seven-day filter.
minimumReleaseAgeExcludes = [
  "vite",
  "wrangler",
  "oxlint",
  "oxfmt",
  "workerd",
  "miniflare",
  "@oxfmt/binding-android-arm-eabi",
  "@oxfmt/binding-android-arm64",
  "@oxfmt/binding-darwin-arm64",
  "@oxfmt/binding-darwin-x64",
  "@oxfmt/binding-freebsd-x64",
  "@oxfmt/binding-linux-arm-gnueabihf",
  "@oxfmt/binding-linux-arm-musleabihf",
  "@oxfmt/binding-linux-arm64-gnu",
  "@oxfmt/binding-linux-arm64-musl",
  "@oxfmt/binding-linux-ppc64-gnu",
  "@oxfmt/binding-linux-riscv64-gnu",
  "@oxfmt/binding-linux-riscv64-musl",
  "@oxfmt/binding-linux-s390x-gnu",
  "@oxfmt/binding-linux-x64-gnu",
  "@oxfmt/binding-linux-x64-musl",
  "@oxfmt/binding-openharmony-arm64",
  "@oxfmt/binding-win32-arm64-msvc",
  "@oxfmt/binding-win32-ia32-msvc",
  "@oxfmt/binding-win32-x64-msvc",
  "@oxlint/binding-android-arm-eabi",
  "@oxlint/binding-android-arm64",
  "@oxlint/binding-darwin-arm64",
  "@oxlint/binding-darwin-x64",
  "@oxlint/binding-freebsd-x64",
  "@oxlint/binding-linux-arm-gnueabihf",
  "@oxlint/binding-linux-arm-musleabihf",
  "@oxlint/binding-linux-arm64-gnu",
  "@oxlint/binding-linux-arm64-musl",
  "@oxlint/binding-linux-ppc64-gnu",
  "@oxlint/binding-linux-riscv64-gnu",
  "@oxlint/binding-linux-riscv64-musl",
  "@oxlint/binding-linux-s390x-gnu",
  "@oxlint/binding-linux-x64-gnu",
  "@oxlint/binding-linux-x64-musl",
  "@oxlint/binding-openharmony-arm64",
  "@oxlint/binding-win32-arm64-msvc",
  "@oxlint/binding-win32-ia32-msvc",
  "@oxlint/binding-win32-x64-msvc",
]
