[install]
# Bun isolated linker: each workspace gets its own node_modules view; no hoisted phantom deps.
linker = "isolated"
# Save exact versions; the lock owner (T02) freezes a real bun.lock.
exact = true
# Refuse to auto-trust install scripts; root package.json keeps trustedDependencies empty.
# 7-day minimum release age: newly published versions are not auto-selected.
minimumReleaseAge = 604800
