# Registry, bootstrap and coordination integrity. Product acceptance and release
# gates remain separate; this workflow does not certify the complete app.
name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (P1: immutable pin, verified vs live tag)
      - name: Set up the frozen registry runner
        # T02's existing uv pin. Install tooling explicitly before checks;
        # verification commands themselves never install project dependencies.
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/python" -m pip install uv==0.12.13 --only-binary=:all: --no-deps
          echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Registered verify group
        # Includes self-check, both bootstrap suites, coordination tests, and
        # synthetic missing-runner/empty-suite failures. Run each suite once.
        run: python3 scripts/task_acceptance.py run verify
